<!-- 마스커블 아이콘 — 안드로이드가 원형·라운드 사각형 등으로 잘라낸다.
     바깥 20% 는 잘려 나갈 수 있으므로 안전 영역(가운데 60%) 안에만 그린다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22b8d8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgm)"/>
  <text x="256" y="330" font-size="208" text-anchor="middle" font-family="AppleColorEmoji, 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🧠</text>
</svg>
